name: Keep the Streamlit app awake

on:
  schedule:
    - cron: "23 */8 * * *"   # about every 8 hours (UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Visit the app (and wake it if asleep)
        run: python scripts/keep_awake.py
      - name: Save a screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep_awake_failure.png
          if-no-files-found: ignore
